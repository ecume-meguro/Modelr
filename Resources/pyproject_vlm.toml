[project]
name = "modelr-vlm"
version = "0.1.0"
description = "VLM environment for Modelr - Vision Language Model for auto-detection"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    # MLX Vision Language Model library
    "mlx-vlm>=0.1.0",
    # PyTorch and Torchvision required by transformers AutoProcessor
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # Shared core module
    "modelr-core",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Disable auto-discovery to avoid picking up unrelated folders
packages = []
py-modules = []

[tool.uv]
# Exclude heavy analytics/data dependencies that are unnecessary
override-dependencies = [
    "pyarrow; sys_platform == 'never'",
    "pandas; sys_platform == 'never'",
]

[tool.uv.sources]
modelr-core = { path = "../../python/modelr_core" }
