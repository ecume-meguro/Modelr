[project]
name = "modelrv3-core"
version = "0.1.0"
description = "Shared Python core module for ModelrV3"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["modelrv3_core*"]
