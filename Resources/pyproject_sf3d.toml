[project]
name = "modelrv3-sf3d"
version = "0.1.0"
# Python dependencies for Stable Fast 3D (SF3D) on Apple Silicon
# MPS support requires PYTORCH_ENABLE_MPS_FALLBACK=1 at runtime
dependencies = [
    # Core ML framework (PyTorch 2.4+ recommended for MPS stability)
    # Required for: Model inference, tensor operations, MPS backend
    "torch>=2.4.0,<3.0.0",
    # Vision utilities for image preprocessing
    # Required for: Image transforms, color space conversions
    "torchvision>=0.19.0,<1.0.0",
    # Numerical computing (pinned for numpy 2.0 compatibility)
    # Required for: Mesh data, image arrays
    "numpy>=1.26.0,<2.0.0",
    # Image processing library
    # Required for: Image I/O, RGBA manipulation
    "pillow>=10.0.0,<11.0.0",
    # Einstein summation notation for tensor ops
    # Required for: SF3D model architecture
    "einops>=0.7.0,<1.0.0",
    # Type hints for JAX-style arrays
    # Required for: SF3D type annotations
    "jaxtyping>=0.2.31,<1.0.0",
    # Configuration management
    # Required for: SF3D model config loading
    "omegaconf>=2.3.0,<3.0.0",
    # Transformers library (Python 3.13 compatible version)
    # Required for: CLIP text encoder, model components
    "transformers>=4.42.0,<5.0.0",
    # OpenCLIP for vision-language models
    # Required for: Image feature extraction
    "open_clip_torch>=2.24.0,<3.0.0",
    # 3D mesh processing library
    # Required for: Mesh export, vertex manipulation
    "trimesh>=4.4.0,<5.0.0",
    # Hugging Face Hub for model downloads
    # Required for: Downloading SF3D weights from stabilityai/stable-fast-3d
    "huggingface_hub>=0.23.0,<1.0.0",
    # Background removal (macOS version without GPU extras)
    # Required for: Preprocessing input images
    "rembg>=2.0.50,<3.0.0",
    # ONNX Runtime for rembg background removal models
    # Required for: Running rembg's segmentation models
    "onnxruntime>=1.16.0,<2.0.0",
    # Instant meshes for mesh simplification
    # Required for: Optional remeshing (triangle/quad)
    "pynanoinstantmeshes>=0.0.3,<1.0.0",
    # Geometry processing toolkit
    # Required for: UV unwrapping, mesh operations
    "gpytoolbox>=0.2.0,<1.0.0",
    # Progress bars
    # Required for: Generation progress display
    "tqdm>=4.66.0,<5.0.0",
    # Safetensors for model weights
    # Required for: Loading .safetensors model files
    "safetensors>=0.4.0,<1.0.0",
    # Setuptools needed for building texture_baker and uv_unwrapper
    "setuptools>=70.0.0",
    "wheel>=0.43.0",
]
requires-python = ">=3.10,<4.0.0"

[tool.uv]
# Override dependencies for Python 3.13 compatibility
override-dependencies = [
    # Tokenizers with pre-built Python 3.13 wheels
    "tokenizers>=0.20.0",
]
# texture_baker and uv_unwrapper are installed manually after uv sync
# because they need --no-build-isolation and setuptools in the venv


