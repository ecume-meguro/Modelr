[project]
name = "modelr-sam"
version = "0.1.0"
description = "SAM3 environment for Modelr with MLX support"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    # Image processing (for sam_wrapper.py)
    "opencv-python>=4.8.0",
    # Local packages (defined in sources below)
    "mlx-sam3",
    "modelr-core",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Disable auto-discovery to avoid picking up unrelated folders in Application Support
packages = []
py-modules = []

[tool.uv.sources]
mlx-sam3 = { path = "../../python/mlx-sam3" }
modelr-core = { path = "../../python/modelr_core" }
