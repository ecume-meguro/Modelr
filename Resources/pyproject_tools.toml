[project]
name = "modelr-tools"
version = "0.1.0"
description = "Lightweight tools environment for Modelr (mesh processing)"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    # Mesh processing
    "trimesh>=4.0.0",
    "numpy>=2.0.0",
    # Graph operations for mesh component analysis
    "networkx>=3.0",
    # Shared core module
    "modelr-core",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Disable auto-discovery
packages = []
py-modules = []

[tool.uv.sources]
modelr-core = { path = "../../python/modelr_core" }
