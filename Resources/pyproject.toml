[project]
name = "modelrv3-backend"
version = "0.1.0"
# Python dependencies for SAM2 segmentation
# Each dependency is essential for the segmentation pipeline
dependencies = [
    # Core ML framework for model inference and tensor operations
    # Required for: Model loading, GPU/CPU computation, autograd
    "torch>=2.0.0,<3.0.0",
    # Vision utilities for image transforms and preprocessing
    # Required for: Image normalization, transforms, data augmentation
    "torchvision>=0.15.0,<1.0.0",
    # Numerical computing library for array operations
    # Required for: Image data representation, mask manipulation
    "numpy>=1.24.0,<2.0.0",
    # Computer vision library for image I/O and processing
    # Required for: Image loading, saving, EXIF handling, color conversions
    "opencv-python>=4.8.0,<5.0.0",
    # Image processing library for opening, converting, and saving images
    # Required for: PIL image operations, format conversion, resizing
    "pillow>=10.0.0,<11.0.0",
    # Configuration management framework for SAM2 model configs
    # Required for: Loading SAM2 model configurations (Hiera architectures)
    "hydra-core>=1.3.0,<2.0.0",
    # File I/O utilities for remote file access
    # Required for: Model checkpoint loading from remote URLs
    "iopath>=0.1.10,<1.0.0",
    # Meta's Segment Anything Model 2 library
    # Required for: SAM2 model loading, inference, mask generation
    "sam2>=0.1.0,<1.0.0",
    # Retry library for handling transient network errors
    # Required for: Robust model checkpoint downloads
    "tenacity>=8.2.0,<9.0.0",
]
requires-python = ">=3.12,<4.0.0"

[tool.uv]
dev-dependencies = []
