[project]
name = "modelrv3-backend"
version = "0.1.0"
# Python dependencies for SAM3 segmentation (MLX version for Apple Silicon)
dependencies = [
    # Apple's ML framework for native Silicon performance
    "mlx>=0.30.0",
    # Core ML framework (used by some utilities in MLX SAM3)
    "torch>=2.9.1",
    # Vision utilities
    "torchvision>=0.24.1",
    # Numerical computing library
    "numpy>=2.0.0",
    # Computer vision library
    "opencv-python>=4.8.0",
    # Image processing library
    "pillow>=12.0.0",
    # File I/O utilities
    "iopath>=0.1.10",
    # Text processing for SAM3
    "ftfy>=6.3.1",
    # Regular expressions for tokenizer
    "regex>=2024.0.0",
    # Hugging Face Hub for model downloads
    "huggingface-hub>=1.1.6",
    # Scientific computing
    "scikit-image>=0.25.0",
    "scikit-learn>=1.6.0",
    # MLX SAM3 implementation (local)
    "mlx-sam3 @ file:///Users/zimengx/Code/MacOS_Utilities/Modelr/v3/mlx-sam3",
    # Retry library for handling transient network errors
    "tenacity>=8.2.0",
]
requires-python = ">=3.13"

[tool.uv]
dev-dependencies = []
