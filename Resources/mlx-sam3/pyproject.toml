[project]
name = "mlx-sam3"
version = "0.1.0"
description = "MLX SAM3 for Modelr - optimized for inference only"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core MLX framework
    "mlx>=0.30.0",
    # Text processing for CLIP tokenizer
    "ftfy>=6.3.1",
    "regex>=2024.0.0",
    # Model download
    "huggingface-hub>=0.19.0",
    # File I/O utilities
    "iopath>=0.1.10",
    # Array operations
    "numpy>=2.0.0",
    # Image processing
    "pillow>=10.0.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sam3", "sam3.model"]

[tool.setuptools.package-data]
sam3 = ["assets/*.txt.gz"]
