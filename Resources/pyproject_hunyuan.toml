[project]
name = "modelr-hunyuan"
version = "0.1.0"
# Python dependencies for Hunyuan3D-2 3D generation
# Optimized for Mac MPS - removed CUDA compilation tools
dependencies = [
    # Core ML framework
    "torch>=2.0.0,<3.0.0",
    # Vision utilities for image preprocessing
    "torchvision>=0.15.0,<1.0.0",
    # Numerical computing
    "numpy>=1.24.0,<2.0.0",
    # Image processing
    "pillow>=10.0.0,<11.0.0",
    # Transformers for VAE/UNet
    "transformers>=4.35.0,<5.0.0",
    # Diffusers for diffusion pipelines
    "diffusers>=0.24.0,<1.0.0",
    # Accelerator for model loading
    "accelerate>=0.25.0,<1.0.0",
    # 3D mesh processing
    "trimesh>=4.0.0,<5.0.0",
    # Hugging Face Hub for model downloads
    "huggingface_hub>=0.19.0,<1.0.0",
    # Safetensors for model weights
    "safetensors>=0.4.0,<1.0.0",
    # Einstein summation notation
    "einops>=0.7.0,<1.0.0",
    # Configuration management
    "omegaconf>=2.3.0,<3.0.0",
    # Computer vision
    "opencv-python>=4.8.0,<5.0.0",
    # YAML parsing
    "pyyaml>=6.0.0,<7.0.0",
    # Hunyuan3D-2 library
    "hy3dgen",
    # Shared core module
    "modelr-core",
]
requires-python = ">=3.10,<4.0.0"

[tool.uv]
# Override problematic transitive dependencies
override-dependencies = [
    "numba>=0.58.0",
    "llvmlite>=0.41.0",
    # Exclude heavy UI/web dependencies from hy3dgen demo interface
    # Using impossible platform marker makes these effectively "not required"
    "gradio; sys_platform == 'never'",
    "gradio-client; sys_platform == 'never'",
    "fastapi; sys_platform == 'never'",
    "uvicorn; sys_platform == 'never'",
    "starlette; sys_platform == 'never'",
    "python-multipart; sys_platform == 'never'",
]

[tool.uv.pip]
no-build-isolation-package = ["hy3dgen"]

[tool.uv.sources]
hy3dgen = { git = "https://github.com/tencent/Hunyuan3D-2.git" }
modelr-core = { path = "../../python/modelr_core" }
